name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npx eslint .

      # next.config.ts sets typescript.ignoreBuildErrors, so `next build` will
      # not catch type errors — this step is the only thing that does.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
